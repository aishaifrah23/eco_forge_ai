<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EcoForge_AI is a human-safe e-waste triage showcase for safer recovery decisions." />
    <title>EcoForge_AI — Human-Safe E-Waste Triage</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom High-Visual Stylesheet -->
    <link rel="stylesheet" href="style.css" />

    <!-- React 18, Babel Standalone & Lucide Icons -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const DATA_ITEMS = [
        {
          id: 'li-battery',
          name: 'Lithium-Ion Battery Pack',
          category: 'Hazardous Energy Storage',
          hazard: 'Critical',
          tone: 'err',
          code: 'UN 3480 / CLASS 9',
          image: 'https://images.unsplash.com/photo-1593941707882-a5bba14938c7?auto=format&fit=crop&w=800&q=80',
          risks: [
            'Thermal runaway reaching >800°C self-sustaining combustion',
            'Hydrogen Fluoride (HF) corrosive acid gas discharge',
            'High-voltage terminal short-circuit arcing'
          ],
          ppe: [
            'EN 388 / EN 374 thermal-chemical gauntlets',
            'Polycarbonate arc blast face shield',
            'Class-D fire blanket & ceramic insulated tools'
          ],
          sop: 'Inspect cell envelope for puncture or swelling. Insulate electrode tabs with dielectric polyimide film. Submerge in dry vermiculite sand buffer before transport.',
          recovery: 'Cobalt (95%), Nickel (92%), High-purity Lithium (82%)'
        },
        {
          id: 'pcb-board',
          name: 'Multi-layer High-Density PCB',
          category: 'Precious & Base Metals',
          hazard: 'Warning',
          tone: 'warn',
          code: 'UN 3077 / CLASS 9',
          image: 'https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=800&q=80',
          risks: [
            'Lead/tin solder micro-particulate inhalation',
            'Brominated flame retardant (BFR) contact toxicity',
            'Fiberglass laminate dust pulmonary abrasion'
          ],
          ppe: [
            'N95 / HEPA particulate respirator',
            'Level 5 cut-resistant micro-nitrile gloves',
            'Anti-static sealed safety goggles'
          ],
          sop: 'De-populate capacitors and transformers mechanically under laminar negative-pressure exhaust. Strictly avoid open-vat acid leach without scrubbers.',
          recovery: 'Gold (340g/ton yield), Silver (2.4kg/ton), Refined Cu (19.4%)'
        },
        {
          id: 'crt-tube',
          name: 'Cathode Ray Tube (CRT) Unit',
          category: 'Hazardous Leaded Silicate',
          hazard: 'Critical',
          tone: 'err',
          code: 'UN 2811 / TOXIC 6.1',
          image: 'https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=800&q=80',
          risks: [
            'High-velocity vacuum implosion fragmentation',
            'Lead silicate systemic poisoning (up to 3.2kg Pb/unit)',
            'Cadmium-activated luminescent phosphor powder'
          ],
          ppe: [
            'Ballistic puncture Kevlar gauntlets',
            'Impact-rated full-coverage blast shield',
            'P100 high-efficiency toxic dust respirator'
          ],
          sop: 'Relieve vacuum slowly by cracking the rear electron-gun nipple under negative-pressure HEPA filtration. Hot-wire crack the seal line to isolate front plate from lead funnel glass.',
          recovery: 'Smelted lead bullion via pyrometallurgy, lead-free cullet front glass'
        },
        {
          id: 'ree-magnet',
          name: 'NdFeB Voice-Coil Actuator',
          category: 'Strategic Rare-Earth Alloys',
          hazard: 'Neutral',
          tone: 'neutral',
          code: 'NON-REGULATED',
          image: 'https://images.unsplash.com/photo-1581092160607-ee22621dd758?auto=format&fit=crop&w=800&q=80',
          risks: [
            'Severe mechanical pinch & skin-crush hazards',
            'Brittle pyrophoric dust upon tool impact',
            'Nickel protective coating degradation flaking'
          ],
          ppe: [
            'Heavy pinch-resistant work gloves',
            'Shatterproof safety glasses'
          ],
          sop: 'Slide magnets apart laterally using dielectric polymer spacers; never strike with steel tools. Secure in dielectric slotted boxes with 150mm air clearance.',
          recovery: 'Neodymium (Nd ~29%), Dysprosium (Dy ~4%), Electrical steel'
        }
      ];

      function App() {
        const [selected, setSelected] = useState(DATA_ITEMS[0]);
        const [query, setQuery] = useState('');
        const [filter, setFilter] = useState('all');

        useEffect(() => {
          if (window.lucide) window.lucide.createIcons();
        }, [selected, query, filter]);

        const filtered = DATA_ITEMS.filter((item) => {
          const matchesQ = item.name.toLowerCase().includes(query.toLowerCase()) ||
                           item.category.toLowerCase().includes(query.toLowerCase());
          const matchesF = filter === 'all' || item.hazard.toLowerCase() === filter.toLowerCase();
          return matchesQ && matchesF;
        });

        return (
          <div className="flex flex-col min-h-screen">
            {/* Nav Header */}
            <header className="app-header">
              <div className="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-8 h-8 rounded-lg bg-[rgba(129,255,137,0.1)] border border-[rgba(129,255,137,0.3)] flex items-center justify-center text-[#81ff89]">
                    <i data-lucide="shield-alert" className="w-4 h-4"></i>
                  </div>
                  <div>
                    <h1 className="font-semibold text-sm tracking-tight text-white flex items-center gap-2">
                      ecoforge<span style={{ color: 'var(--c-accent)' }}>.ai</span>
                      <span className="badge-pill acid mono text-[10px]">triage v2.4</span>
                    </h1>
                  </div>
                </div>

                <div className="flex items-center gap-2.5 px-3 py-1 rounded-full bg-[#141416] border border-[#222] text-xs">
                  <div className="radar-beacon w-2 h-2 rounded-full bg-[#81ff89]"></div>
                  <span className="mono text-[11px] text-zinc-300 font-medium">LIVE TRIAGE</span>
                </div>
              </div>
            </header>

            {/* Main Application Area */}
            <main className="flex-1 max-w-6xl mx-auto w-full px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-6">
              
              {/* Left Column: Stream Index */}
              <section className="lg:col-span-5 space-y-3">
                <div className="flex items-center justify-between pb-1">
                  <h2 className="text-xs font-semibold uppercase tracking-wider text-zinc-400 mono flex items-center gap-1.5">
                    <i data-lucide="cpu" className="w-3.5 h-3.5 text-[#81ff89]"></i>
                    E-Waste Inventory
                  </h2>
                  <div className="flex gap-1">
                    {['all', 'critical', 'warning'].map((f) => (
                      <button
                        key={f}
                        onClick={() => setFilter(f)}
                        className={`filter-btn capitalize ${filter === f ? 'active' : ''}`}
                      >
                        {f}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Filter Input */}
                <div className="relative">
                  <input
                    type="text"
                    value={query}
                    onChange={(e) => setQuery(e.target.value)}
                    placeholder="Search material or component..."
                    className="w-full bg-[#111] border border-[rgba(255,255,255,0.08)] rounded-xl px-3.5 py-2 pl-9 text-xs text-zinc-200 placeholder-zinc-500 focus:outline-none focus:border-[#81ff89]/50 transition"
                  />
                  <i data-lucide="search" className="w-3.5 h-3.5 text-zinc-500 absolute left-3 top-2.5"></i>
                </div>

                {/* Catalog Card List */}
                <div className="space-y-2 pt-1 max-h-[600px] overflow-y-auto pr-1">
                  {filtered.map((item) => (
                    <div
                      key={item.id}
                      onClick={() => setSelected(item)}
                      className={`item-row flex items-center gap-3 ${
                        selected.id === item.id ? 'active' : ''
                      }`}
                    >
                      <img 
                        src={item.image} 
                        alt={item.name} 
                        className="w-12 h-12 rounded-lg object-cover border border-white/10 shrink-0" 
                      />
                      <div className="flex-1 min-w-0">
                        <div className="flex items-center justify-between gap-2">
                          <p className="text-xs font-medium text-zinc-100 truncate">{item.name}</p>
                          <span className={`badge-pill ${item.tone}`}>
                            {item.hazard}
                          </span>
                        </div>
                        <p className="text-[11px] text-zinc-500 truncate mt-0.5">{item.category}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </section>

              {/* Right Column: Visual Protocol Panel */}
              <section className="lg:col-span-7 emergent-card scanline-card p-6 flex flex-col gap-5 fade-in-slide" key={selected.id}>
                
                {/* Visual Banner Image */}
                <div className="component-hero-img-wrap">
                  <img 
                    src={selected.image} 
                    alt={selected.name} 
                    className="component-hero-img"
                  />
                  <div className="component-hero-img-overlay flex flex-col justify-end p-4">
                    <div className="flex items-center justify-between">
                      <span className="mono text-[10px] tracking-widest text-[#81ff89] bg-[#09090b]/80 px-2 py-0.5 rounded border border-[#81ff89]/30">
                        {selected.code}
                      </span>
                      <span className={`badge-pill ${selected.tone}`}>
                        {selected.hazard} Priority
                      </span>
                    </div>
                    <h3 className="headline-gradient text-xl font-bold mt-1.5">{selected.name}</h3>
                    <p className="text-xs text-zinc-300">{selected.category}</p>
                  </div>
                </div>

                {/* Operator Hazards */}
                <div className="space-y-2">
                  <span className="mono text-[11px] uppercase tracking-wider text-zinc-400 flex items-center gap-1.5">
                    <i data-lucide="alert-octagon" className="w-3.5 h-3.5 text-rose-400"></i>
                    Operational Hazards
                  </span>
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    {selected.risks.map((risk, i) => (
                      <div key={i} className="emergent-inset p-2.5 text-xs text-zinc-300 leading-snug flex items-start gap-2">
                        <span className="w-1.5 h-1.5 rounded-full bg-rose-400 shrink-0 mt-1"></span>
                        <span>{risk}</span>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Mandatory PPE */}
                <div className="space-y-2">
                  <span className="mono text-[11px] uppercase tracking-wider text-zinc-400 flex items-center gap-1.5">
                    <i data-lucide="shield" className="w-3.5 h-3.5 text-[#81ff89]"></i>
                    Mandatory Personal Protective Equipment
                  </span>
                  <div className="emergent-inset p-3 space-y-1.5">
                    {selected.ppe.map((gear, i) => (
                      <p key={i} className="text-xs text-zinc-300 flex items-center gap-2">
                        <span style={{ color: 'var(--c-accent)' }}>✓</span> {gear}
                      </p>
                    ))}
                  </div>
                </div>

                {/* SOP Protocol */}
                <div className="space-y-2">
                  <span className="mono text-[11px] uppercase tracking-wider text-zinc-400 flex items-center gap-1.5">
                    <i data-lucide="file-text" className="w-3.5 h-3.5 text-[#81ff89]"></i>
                    Standard Dismantling Protocol
                  </span>
                  <div className="emergent-inset p-3.5 text-xs leading-relaxed text-zinc-300">
                    {selected.sop}
                  </div>
                </div>

                {/* Circular Yield Potential */}
                <div className="pt-2 border-t border-[#1f1f23] flex items-center justify-between text-xs">
                  <span className="text-zinc-500">Circular Recovery Potential:</span>
                  <span className="mono text-zinc-200 font-medium">{selected.recovery}</span>
                </div>
              </section>

            </main>

            {/* Footer */}
            <footer className="border-t border-[#1f1f23] py-3 text-center text-xs text-zinc-600 mono">
              ecoforge.ai — human-safe e-waste triage showcase
            </footer>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
